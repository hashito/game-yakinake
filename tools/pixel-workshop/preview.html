<main><header><small>PIXEL WORKSHOP　/　原画の試写</small><h1>駒を見比べる</h1><p>原寸と拡大を並べて、輪郭や動きのつながりを確認できます。</p></header>
<div class="row"><label for="sample">同梱作例</label><select id="sample"></select><label for="bg">背景</label><select id="bg"><option value="grid">市松</option><option value="pale">明色</option><option value="dark">暗色</option></select></div>
<figure><div id="stage" class="stage grid"><canvas id="small" aria-label="原寸"></canvas><canvas id="large" aria-label="整数倍の拡大"></canvas></div><figcaption id="stats"></figcaption></figure>
<div class="row"><button id="play" class="primary">再生</button><button id="prev">前の駒</button><button id="next">次の駒</button><button id="first">先頭に戻る</button><label for="scale">拡大</label><select id="scale"><option value="3">3倍</option><option value="5" selected>5倍</option><option value="8">8倍</option></select></div>
<section><h2>自分の書き出しを開く</h2><p>工房が書き出した同名のPNGとJSONを一緒に選んでください。ファイルはこのページ内で表示します。</p>
<label for="files">PNGとJSONを選ぶ</label><input id="files" type="file" accept=".png,.json" multiple><output id="msg" role="status"></output></section></main>
<script>
'use strict';

 "y": 0, "w": 32, "h": 24, "duration": 65}, {"x": 128, "y": 0, "w": 32, "h": 24, "duration": 60}, {"x": 160, "y": 0, "w": 32, "h": 24, "duration": 110}, {"x": 192, "y": 0, "w": 32, "h": 24, "duration": 220}]}, "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAOAAAAAYCAYAAADj7PGVAAACBUlEQVR4nO2aQU7EMAxFeyB2SHMHDsAd2LAZseFOSCwR29lzBZZzAvZFQbJkeZI0KXacJv9L1gxqJ892+pt0mGWBIAg6oj6u32sI7zwgaDrBeNtCjyAzlVxcLS/A18/LDcvTAL2YL9YX6IDiExnerz9ff9vP8J6iFT92jHLq5YLrwYC99GI4eU8uN2B4pWg94dx4XjnEpD0/e2rqoQ/DiZrqbcAlsgp6GZC4VvzSMQNfmw3t0PXtvFJYMXLfPrbgyy0fvVJY83kesRy0+TUmbNH/nIbkvz89FDc2nEuhlQgfK7f6hQvAki+3fLEtIM/Bov7Ys6jMwYKfMracD+v6va+/5nwahA9cAtdKpDc+Nx6dw1e/ENZ8yoG2vzIHS740HP97hvlvxqcPxgZMfeb+7rRS5BLhRR2Rn9qSteDzVZcbsGX99AggzTjL/Kvyt07gQYOnEpCJpO4IW3cK8Lf50nwe9aceB2bovxY/uWzGwKUJLAV3g5oA/5a/9U3w6PWPws8asBaq3QTw0/ySf8WMXP8o/KQB/wtPJSID/P380h+Dj1y/J1+j/uxBDXjQ48tzlgE++LX8mh9j9Fx/3p1KCgnIJEqaAj74KdUasNf68wcbJAA++DPzYUDwwe/BgDIsEogxwAd/Zj4MCD74ngbky6IMrQRyDPDBn5kPA4IPvqcBIQjy0y9UQAlOQdzqpwAAAABJRU5ErkJggg=="}, {"label": "管の継ぎ目 ｜ 水滴", "meta": {"image": "water-drip.png", "width": 24, "height": 32, "pivot": [13, 10], "loop": true, "frames": [{"x": 0, "y": 0, "w": 24, "h": 32, "duration": 420}, {"x": 24, "y": 0, "w": 24, "h": 32, "duration": 180}, {"x": 48, "y": 0, "w": 24, "h": 32, "duration": 130}, {"x": 72, "y": 0, "w": 24, "h": 32, "duration": 75}, {"x": 96, "y": 0, "w": 24, "h": 32, "duration": 70}, {"x": 120, "y": 0, "w": 24, "h": 32, "duration": 65}, {"x": 144, "y": 0, "w": 24, "h": 32, "duration": 65}, {"x": 168, "y": 0, "w": 24, "h": 32, "duration": 95}, {"x": 192, "y": 0, "w": 24, "h": 32, "duration": 140}]}, "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAANgAAAAgCAYAAABw4baZAAABuElEQVR4nO2bS07DMBBAcx1uAAtWvQELpF6BHRKCLTuuwYYKseMOHIE1VwkahKup63z8GTeN35NGipLojRN5NLGrdh0A1GOzve114MePP4OLy+tex8fn60EC/zp+/PgjEKEfOoE+n5IIP/6W/d39y3Ovw0/gX5OQ47mJ8ONv2R+VwI/SD4Af/9r8WQnmJMGPv2V/1CIvJQF+/C37j9Dyzf82pUjk+P3xZh/+IPDjx5+ISzAUuQnw42/Zf9RGQ1HSf3X3dNZ+6/eDf13+gyQyOV0Uk1f0hwqstL/4y const id=k=>document.getElementById(k);
let meta, pic, frame=0, timer=null, version=0;
const sample=id('sample'), play=id('play'), msg=id('msg');
const between=(n,lo,hi)=>Number.isInteger(n)&&n>=lo&&n<=hi;
function valid(m,file){
 if(!m||typeof m!=='object'||m.image!==file||!between(m.width,1,64)||!between(m.height,1,64)||typeof m.loop!=='boolean'||!Array.isArray(m.pivot)||m.pivot.length!==2||!between(m.pivot[0],0,m.width-1)||!between(m.pivot[1],0,m.height-1)||!Array.isArray(m.frames)||!between(m.frames.length,1,32))throw Error('工房のアトラスJSONを選んでください。');
 for(const [i,f] of m.frames.entries())if(!f||f.w!==m.width||f.h!==m.height||f.x!==i*m.width||f.y!==0||!between(f.duration,20,5000))throw Error('駒の座標・寸法・時間に問題があります。');
}
function stop(){clearTimeout(timer);timer=null;play.textContent='再生';}
function draw(){
 if(!meta||!pic)return;
 const f=meta.frames[frame];
 for(const [el,z] of [[id('small'),1],[id('large'),Number(id('scale').value)]]){
  el.width=f.w*z;el.height=f.h*z;const c=el.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(pic,f.x,f.y,f.w,f.h,0,0,el.width,el.height);
 }
 id('stats').textContent=meta.image+'　｜　'+meta.width+' × '+meta.height+' px　｜　'+(frame+1)+' / '+meta.frames.length+' 駒　｜　'+f.duration+' ms　｜　'+(meta.loop?'繰り返し':'単発')+'　｜　支点 ('+meta.pivot.join(', ')+')';
 for(const b of [play,id('prev'),id('next'),id('first')])b.disabled=meta.frames.length===1;
}
function schedule(){timer=setTimeout(()=>{if(!meta.loop&&frame===meta.frames.length-1){stop();return;}frame=(frame+1)%meta.frames.length;draw();schedule();},meta.frames[frame].duration);}
function jump(n){if(!meta)return;stop();frame=(n+meta.frames.length)%meta.frames.length;draw();}
play.onclick=()=>{if(!meta)return;if(timer!==null){stop();return;}if(frame===meta.frames.length-1)frame=0;draw();play.textContent='一時停止';schedule();};
id('next').onclick=()=>jump(frame+1);id('prev').onclick=()=>jump(frame-1);id('first').onclick=()=>jump(0);
id('bg').onchange=e=>{id('stage').className='stage '+e.target.value;};id('scale').onchange=draw;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
async function show(m,url,tag){const p=new Image();p.src=url;await p.decode();if(tag!==version)return;if(p.naturalWidth!==m.width*m.frames.length||p.naturalHeight!==m.height)throw Error('PNGとJSONの寸法が一致しません。');stop();meta=m;pic=p;frame=0;draw();}
const custom=document.createElement('option');custom.value='';custom.textContent='自分の書き出し';custom.hidden=true;sample.append(custom);
for(const s of samples){const o=document.createElement('option');o.value=s.meta.image;o.textContent=s.label;sample.append(o);}
async function preset(){const s=samples.find(s=>s.meta.image===sample.value);if(!s)return;id('files').value='';msg.textContent='';stop();const tag=++version;try{await show(s.meta,s.src,tag);}catch{if(tag===version)msg.textContent='同梱画像を開けませんでした。';}}
sample.onchange=preset;sample.selectedIndex=1;preset();
id('files').onchange=async e=>{
 const files=Array.from(e.target.files),tag=++version;let url;stop();msg.textContent='';
 try{const j=files.find(f=>f.name.endsWith('.json')),p=files.find(f=>f.name.endsWith('.png'));if(files.length!==2||!j||!p||j.name.slice(0,-5)!==p.name.slice(0,-4))throw Error('同じ名前のPNGとJSONを2ファイル選んでください。');
 if(j.size>65536||p.size>1048576||p.size<33)throw Error('工房の出力サイズを超えています。');
 const m=JSON.parse(await j.text());valid(m,p.name);
 const v=new DataView(await p.arrayBuffer());if(v.getUint32(0)!==0x89504e47||v.getUint32(4)!==0x0d0a1a0a||v.getUint32(8)!==13||v.getUint32(12)!==0x49484452||v.getUint32(16)!==m.width*m.frames.length||v.getUint32(20)!==m.height||v.getUint8(24)!==8||v.getUint8(25)!==6)throw Error('透過PNGの形式・寸法を確認してください。');
 // The local encoder writes a single IDAT and no metadata or animation chunks.
 if(v.byteLength<57||v.getUint8(26)!==0||v.getUint8(27)!==0||v.getUint8(28)!==0||v.getUint32(37)!==0x49444154)throw Error('工房が書き出した静止PNGシートを選んでください。');
 const tail=45+v.getUint32(33);
 if(tail+12!==v.byteLength||v.getUint32(tail)!==0||v.getUint32(tail+4)!==0x49454e44)throw Error('PNGに追加データが含まれています。元の工房出力を選んでください。');
 url=URL.createObjectURL(new Blob([p],{type:'image/png'}));await show(m,url,tag);if(tag===version){custom.hidden=false;sample.value='';msg.textContent=p.name+' を開きました。';}
 }catch(err){if(tag===version)msg.textContent=err instanceof SyntaxError?'JSONの書式を確認してください。':(err.message||'画像を開けませんでした。');}finally{if(url)URL.revokeObjectURL(url);}
};
